function seedId(g,ph){return 'seed:'+(g+'/'+ph).toLowerCase().replace(/[^a-z0-9/]+/g,'-')}
const seed=raw.map(r=>({id:seedId(r[0],r[1]),group:r[0],phrase:r[1],zh:r[2],hint:r[3],example:r[4],user:false}));
const legacySeedIds=raw.map((r,i)=>['seed-'+i,seedId(r[0],r[1])]);
const DB='phrasemap-personal-v1';let db;let tab='map';let selected='UP';let quiz=null;let mode='multiple';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;for(let n of ['phrases','media','progress','notes','meta'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)});}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(n){return req(store(n).getAll())}function get(n,id){return req(store(n).get(id))}
function put(n,val){return req(store(n,'readwrite').put(val))}
function del(n,id){return req(store(n,'readwrite').delete(id))}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'u-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
let entries=[];
async function migrateSeedIds(){if(await get('meta','seedIds-v2'))return;let map=new Map(legacySeedIds);for(let n of ['progress','notes']){for(let rec of await all(n)){let nid=map.get(rec.id);if(nid&&!(await get(n,nid))){await put(n,{...rec,id:nid});await del(n,rec.id)}}}for(let m of await all('media')){let nid=map.get(m.phraseId);if(nid)await put('media',{...m,phraseId:nid})}await put('meta',{id:'seedIds-v2',at:Date.now()})}
async function load(){let local=await all('phrases');entries=[...seed.filter(s=>!local.some(x=>x.id===s.id)),...local];}
function link(p){return '<button class="secondary" data-open="'+esc(p.id)+'">查看／製作牌卡</button>'}
function bindLinks(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>detail(x.dataset.open))}
function nav(){let names=[['map','意象地圖'],['library','片語庫'],['quiz','牌卡複習'],['images','圖片與筆記'],['backup','備份／匯入']];$('nav').innerHTML=names.map(x=>'<button class="'+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()})}
function render(){nav();if(tab==='map')mapView();if(tab==='library')libraryView();if(tab==='quiz')quizView();if(tab==='images')imagesView();if(tab==='backup')backupView();}
function mapView(){let list=entries.filter(p=>p.group===selected);$('view').innerHTML='<section class="hero"><h2>17 個核心小詞教學入口</h2><p class="sub">從「空間 → 時間／狀態 → 抽象語意」建立自己的記憶路徑。此版為原創教學聯想，非原書全文轉載。</p></section><div class="grid">'+groups.map(g=>'<button class="tile" data-group="'+esc(g[0])+'"><strong>'+esc(g[0])+'</strong><span>'+esc(g[1])+'</span><span class="sub">'+entries.filter(x=>x.group===g[0]).length+' 個示範片語</span></button>').join('')+'</div><section class="panel" style="margin-top:16px"><h2>'+esc(selected)+'：'+esc((groups.find(x=>x[0]===selected)||[])[1])+'</h2><p class="sub">示範資料分成具體空間畫面、意義延伸與片語。更多高頻片語可自行加入。</p>'+list.map(p=>'<div class="row between" style="border-top:1px solid var(--line);padding:10px 0"><div><b>'+esc(p.phrase)+'</b>　'+esc(p.zh)+'<div class="sub">'+esc(p.hint)+'</div></div>'+link(p)+'</div>').join('')+'</section>';document.querySelectorAll('[data-group]').forEach(x=>x.onclick=()=>{selected=x.dataset.group;render()});bindLinks();}
function libraryView(){let filter=window.libfilter||'';let rows=entries.filter(p=>(p.phrase+' '+p.zh+' '+p.group).toLowerCase().includes(filter.toLowerCase()));$('view').innerHTML='<div class="row between"><h2>片語知識庫</h2><button id="newEntry">＋ 自行新增片語</button></div><input id="search" placeholder="搜尋英文、中文或小詞" value="'+esc(filter)+'"><p class="sub">目前 '+entries.length+' 筆（'+seed.length+' 筆示範預載資料）；自建資料不會被更新覆蓋。</p><div class="grid">'+rows.map(p=>'<article class="panel"><span class="pill">'+esc(p.group)+'</span><h3>'+esc(p.phrase)+'</h3><div>'+esc(p.zh)+'</div><div class="sub">'+esc(p.hint)+'</div>'+link(p)+'</article>').join('')+'</div>';$('search').oninput=e=>{window.libfilter=e.target.value;libraryView();$('search').focus();$('search').setSelectionRange(window.libfilter.length,window.libfilter.length)};$('newEntry').onclick=addEntry;bindLinks();}
function addEntry(){let opts=groups.filter(g=>g[0]!=='ABOUT / (A)ROUND').map(g=>'<option>'+esc(g[0])+'</option>').join('');$('view').innerHTML='<div class="panel"><h2>新增個人片語</h2><label>所屬小詞</label><select id="ag">'+opts+'</select><label>英文片語</label><input id="ap" placeholder="e.g. brush up on"><label>中文意思（請只填一種語意）</label><input id="az"><label>認知聯想</label><textarea id="ah"></textarea><label>英文例句</label><textarea id="ae"></textarea><div class="toolbar"><button id="save">儲存到本機</button><button class="secondary" id="cancel">取消</button></div><div id="msg" role="status"></div></div>';$('cancel').onclick=render;$('save').onclick=async()=>{let phrase=$('ap').value.trim(),zh=$('az').value.trim();if(!phrase||!zh){$('msg').textContent='英文與中文不能留空';return}await put('phrases',{id:uuid(),group:$('ag').value,phrase,zh,hint:$('ah').value,example:$('ae').value,user:true});await load();libraryView()};}
async function detail(id){let p=entries.find(x=>x.id===id);if(!p)return;let imgs=(await all('media')).filter(m=>m.phraseId===id);let note=await get('notes',id);$('view').innerHTML='<button class="secondary" id="back">← 返回</button><article class="panel" style="margin-top:12px"><span class="pill">'+esc(p.group)+'</span><h2>'+esc(p.phrase)+'</h2><h3>'+esc(p.zh)+'</h3><div class="meaning">'+esc(p.hint)+'</div><p>'+highlight(p.example,p.phrase)+'</p><div class="columns"><section><h3>個人筆記</h3><textarea id="note" rows="5" placeholder="自己理解的空間畫面與例句">'+esc(note?.text||'')+'</textarea><button id="saveNote">儲存筆記</button><h3>生成教學圖片提示詞</h3><p class="sub">可複製到 ChatGPT 等圖像工具，再將結果匯回。</p><button class="secondary" id="prompt">複製中國竹風 Prompt</button><div id="notice" class="sub"></div></section><section><h3>我的圖片（'+imgs.length+'）</h3><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><div class="grid" id="photos">'+imgs.map(m=>'<div><img class="thumb" src="'+URL.createObjectURL(m.blob)+'" alt="個人記憶圖"><button class="secondary" data-remove="'+esc(m.id)+'">刪除此圖片</button></div>').join('')+'</div></section></div>'+(p.user?'<button class="secondary" id="deleteEntry">刪除個人片語</button>':'')+'</article>';$('back').onclick=render;$('saveNote').onclick=async()=>{await put('notes',{id,text:$('note').value});$('notice').textContent='筆記已儲存'};$('prompt').onclick=async()=>{let s='請製作繁體中文英文片語認知資訊圖，片語 '+p.phrase+'，意思 '+p.zh+'，核心小詞 '+p.group+'。意象：'+p.hint+'。用起始→變化→結果呈現空間／抽象語意。採 editorial-infographic-tw：米白紙張 #F4F1E9、深墨綠 #274735、灰綠 #7A9276，搭配節制的中國竹葉水墨裝飾、清晰繁體字、雜誌式排版、留白、正確英文拼字，避免霓虹與重複卡框。';try{await navigator.clipboard.writeText(s);$('notice').textContent='提示詞已複製'}catch{$('notice').textContent=s}};$('upload').onchange=async(e)=>{let f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>8*1024*1024){alert('僅允許 PNG/JPEG/WebP 且小於 8MB');return}await put('media',{id:uuid(),phraseId:id,name:f.name,blob:f,createdAt:Date.now()});detail(id)};document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=async()=>{if(confirm('確定刪除這張圖片？')){await del('media',x.dataset.remove);detail(id)}});if(p.user)$('deleteEntry').onclick=async()=>{if(confirm('確定刪除此片語？相關筆記與圖片不會自動刪除，請先自行備份。')){await del('phrases',id);await load();libraryView()}};}
const IRREG={give:['gave','given'],run:['ran'],take:['took','taken'],find:['found'],go:['went','gone'],get:['got','gotten'],come:['came'],break:['broke','broken'],think:['thought'],throw:['threw','thrown'],write:['wrote','written'],speed:['sped'],leave:['left'],cut:[],set:[],put:[]};
function forms(v){v=v.toLowerCase();let f=new Set([v,...(IRREG[v]||[])]);let cvc=/[^aeiou][aeiou][bdgklmnprt]$/.test(v)&&v.length<=4;let stem=cvc?v+v.slice(-1):v;if(/e$/.test(v)){f.add(v+'s');f.add(v+'d');f.add(v.slice(0,-1)+'ing')}else if(/[^aeiou]y$/.test(v)){f.add(v.slice(0,-1)+'ies');f.add(v.slice(0,-1)+'ied');f.add(v+'ing')}else{f.add(/(s|x|z|ch|sh)$/.test(v)?v+'es':v+'s');if(!(v in IRREG))f.add(stem+'ed');f.add(stem+'ing')}return f}
function highlight(text,phrase){let words=String(phrase||'').trim().toLowerCase().split(/\s+/).map(w=>w.replace(/[^a-z']/g,'')).filter(Boolean);if(!words.length)return esc(text);let vf=forms(words[0]);let parts=new Set(words.slice(1));let seen=false,done=new Set();return String(text||'').split(/([A-Za-z']+)/).map(t=>{let l=t.toLowerCase();if(!seen&&vf.has(l)){seen=true;return '<span class="red">'+esc(t)+'</span>'}if(seen&&parts.has(l)&&!done.has(l)){done.add(l);return '<span class="particle">'+esc(t)+'</span>'}return esc(t)}).join('')}
async function quizView(){if(!quiz){$('view').innerHTML='<div class="panel"><h2>Anki 風格記憶複習</h2><p>先看英文，再選正確中文；或使用翻卡自評。不同意思以獨立詞義卡呈現。</p><label>選擇小詞</label><select id="qgroup">'+groups.map(g=>'<option value="'+esc(g[0])+'" '+(selected===g[0]?'selected':'')+'>'+esc(g[0])+' · '+esc(g[1])+'</option>').join('')+'</select><label>模式</label><select id="qmode"><option value="multiple">隨機中文四選一</option><option value="flip">翻卡自評</option></select><label>題數</label><select id="qcount"><option>10</option><option>20</option><option>30</option></select><p class="sub">某組少於 4 個不同中文意思時，會提示改用翻卡或補充詞條。</p><button id="start">開始複習</button></div>';$('start').onclick=()=>{selected=$('qgroup').value;mode=$('qmode').value;let pool=entries.filter(x=>x.group===selected);if(!pool.length){alert('該組尚未有牌卡');return}if(mode==='multiple'&&new Set(pool.map(x=>x.zh)).size<4){alert('此組不足 4 個不同中文選項，請改用翻卡自評或新增片語。');return}quiz={items:shuffle(pool).slice(0,Number($('qcount').value)),index:0,correct:0,answered:false};quizView()};return}let p=quiz.items[quiz.index];if(!p){$('view').innerHTML='<article class="panel"><h2>練習完成</h2><p>本回合：'+quiz.correct+' / '+quiz.items.length+' 題</p><button id="again">返回練習設定</button></article>';$('again').onclick=()=>{quiz=null;quizView()};return}let pool=entries.filter(x=>x.group===selected);let distractors=shuffle(pool.filter(x=>x.zh!==p.zh)).filter((x,i,a)=>a.findIndex(y=>y.zh===x.zh)===i).slice(0,3);let options=shuffle([p,...distractors]);$('view').innerHTML='<article class="panel"><div class="row between"><span class="pill">'+esc(selected)+'</span><span class="sub">第 '+(quiz.index+1)+' / '+quiz.items.length+' 題　答對 '+quiz.correct+'</span></div><h2 style="font-size:2.1rem;text-align:center;margin:35px 0">'+esc(p.phrase)+'</h2>'+(mode==='flip'?'<div class="row"><button id="flip">翻面顯示答案</button></div><div class="hidden meaning" id="answer">'+esc(p.zh)+'<p>'+esc(p.hint)+'</p><button id="self0" class="secondary">忘記</button> <button id="self1">記得</button></div>':'<p>請選擇正確中文意思：</p><div class="options">'+options.map(x=>'<button data-choice="'+esc(x.id)+'">'+esc(x.zh)+'</button>').join('')+'</div><div id="feedback" class="hidden meaning"></div><button id="next" class="hidden">下一題 →</button>')+'</article>';if(mode==='flip'){$('flip').onclick=()=>{$('answer').classList.remove('hidden');$('flip').disabled=true};for(let i=0;i<2;i++)$('self'+i).onclick=()=>record(i===1,p)}else{document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{if(quiz.answered)return;quiz.answered=true;let ok=x.dataset.choice===p.id;document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(b.dataset.choice===p.id)b.classList.add('correct');else if(b===x)b.classList.add('wrong')});$('feedback').classList.remove('hidden');$('feedback').innerHTML=(ok?'答對了！':'答錯了，正解：'+esc(p.zh))+'<p>'+esc(p.hint)+'</p>';$('next').classList.remove('hidden');recordProgress(ok,p);if(ok)quiz.correct++});$('next').onclick=()=>{quiz.index++;quiz.answered=false;quizView()}}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function recordProgress(ok,p){let prev=await get('progress',p.id);await put('progress',{id:p.id,attempts:(prev?.attempts||0)+1,correct:(prev?.correct||0)+(ok?1:0),updatedAt:Date.now()})}
async function record(ok,p){await recordProgress(ok,p);if(ok)quiz.correct++;quiz.index++;quizView()}
async function imagesView(){let imgs=await all('media'),notes=await all('notes');$('view').innerHTML='<h2>個人記憶圖與筆記</h2><p class="sub">圖片直接保存在本瀏覽器的 IndexedDB，而不是程式檔案中。清除網站資料、瀏覽器設定檔或換裝置仍可能遺失，因此請定期匯出備份。</p><div class="banner">共 '+imgs.length+' 張圖片、'+notes.length+' 筆筆記。點選片語進入編輯頁面上傳圖片。</div><div class="grid" style="margin-top:14px">'+imgs.map(m=>{let p=entries.find(x=>x.id===m.phraseId);return '<article class="panel"><img class="thumb" src="'+URL.createObjectURL(m.blob)+'" alt="'+esc(m.name)+'"><h3>'+esc(p?.phrase||'未找到片語')+'</h3><button class="secondary" data-open="'+esc(m.phraseId)+'">查看</button></article>'}).join('')+'</div>';bindLinks()}
function blobToData(blob){return new Promise((ok,no)=>{let f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>no(f.error);f.readAsDataURL(blob)})}
async function backupView(){$('view').innerHTML='<article class="panel"><h2>安全備份與還原</h2><p>個人資料存在 IndexedDB，更新網頁不執行清空。下載完整 JSON 備份（包含圖片），換瀏覽器或清除資料前請先備份。</p><div class="toolbar"><button id="export">下載完整備份</button><label class="button" style="margin:0">匯入備份<input id="import" type="file" accept=".json,application/json" class="hidden"></label></div><p class="sub">匯入採合併策略（同 ID 更新），不先清空既有資料。請確保備份檔案可信。</p><div id="status" role="status"></div></article>';$('export').onclick=async()=>{try{let payload={format:'PhraseMapBackup',version:2,createdAt:new Date().toISOString(),stores:{}};for(let n of ['phrases','progress','notes'])payload.stores[n]=await all(n);payload.stores.media=[];for(let m of await all('media'))payload.stores.media.push({...m,blob:await blobToData(m.blob)});let b=new Blob([JSON.stringify(payload)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='phrasemap-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);$('status').textContent='備份檔案已準備下載'}catch(e){$('status').textContent='備份失敗：'+e.message}};$('import').onchange=async(e)=>{try{let f=e.target.files[0];if(!f)return;let obj=JSON.parse(await f.text());if(obj.format!=='PhraseMapBackup'||![1,2].includes(obj.version)||!obj.stores||!Array.isArray(obj.stores.phrases))throw Error('格式不相容');if(!confirm('將合併備份資料到此瀏覽器（同 ID 會更新），確定嗎？'))return;for(let n of ['phrases','progress','notes','media']){if(!Array.isArray(obj.stores[n]))continue;for(let rec of obj.stores[n]){if(!rec.id)continue;let lm=new Map(legacySeedIds);if(n!=='phrases'&&n!=='media'&&lm.has(rec.id))rec.id=lm.get(rec.id);if(n==='media'&&lm.has(rec.phraseId))rec.phraseId=lm.get(rec.phraseId);if(n==='media'){if(typeof rec.blob!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(rec.blob))continue;let resp=await fetch(rec.blob);rec.blob=await resp.blob()}await put(n,rec)}}await load();$('status').textContent='匯入完成，資料已合併'}catch(err){$('status').textContent='匯入失敗：'+err.message}}}
(async()=>{try{await openDB();await migrateSeedIds();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});await load();render()}catch(e){$('view').innerHTML='<div class="banner">無法啟動本機資料庫：'+esc(e.message)+'。請使用支援 IndexedDB 的現代瀏覽器並確認不是限制儲存的模式。</div>'}})();
</script></body></html>
